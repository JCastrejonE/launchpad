# TLS terminator for Mission Control (spec 0125 step D). Install to
# /etc/nginx/sites-available/launchpad and symlink into sites-enabled.
#
# nginx rather than Traefik: it was already installed and supervised on this
# host (it fronted the ERP that used to live here), so this is a vhost swap
# instead of a second ingress. The tenant/staging fleet still uses Traefik.
#
# Certificate: real Let's Encrypt, for launchpad.example.com (the owner pointed the A
# record at this box on 2026-08-04). The self-signed sslip.io cert it replaced
# is kept on the box only as the fallback for unmatched SNI — sslip.io is not on
# the Public Suffix List, so Let's Encrypt rate-limits it across every user of
# that domain and it could never have had a real cert.
server {
    listen 80;
    listen [::]:80;
    server_name launchpad.example.com;

    # HTTP-01 challenge, served before the redirect. `certbot certonly --nginx`
    # inserts its own temporary block, but renewal in 60 days should not depend
    # on that still working: an explicit webroot makes `certbot renew` viable
    # with either authenticator. Verified with `certbot renew --dry-run`.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` and NOT the standalone `http2 on;`: this host runs the
    # nginx Ubuntu 22.04 ships (1.18), which predates that directive by seven
    # minor versions and rejects the config outright.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name launchpad.example.com;

    ssl_certificate     /etc/letsencrypt/live/launchpad.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/launchpad.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/launchpad.example.com/chain.pem;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:launchpad:10m;

    # Agent transcripts and spec bodies are posted through here.
    client_max_body_size 25m;

    # Proxy settings live at SERVER level so the two location blocks below differ
    # in exactly one thing — their error handling — instead of duplicating ten
    # lines that could drift apart.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Auth.js (trustHost: true) builds sign-in callback URLs from the forwarded
    # host. Without this it derives them from the internal origin and the login
    # POST bounces to localhost:3000. Note what this is NOT: an authorization
    # signal — authorization is the signed session cookie alone (audit finding
    # #2), and these headers only shape URLs.
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    # The supervisor/chat bridge is Server-Sent Events. Default buffering holds
    # the stream until the response ends, which for SSE is never — the console
    # would look hung rather than broken. Both lines are load-bearing.
    proxy_buffering off;
    proxy_read_timeout 3600s;

    # Browsers get the friendly page during the seconds after a reboot when nginx
    # is listening but `next start` is not ready yet. `=503` is deliberate: a bare
    # `=` would adopt the page's own 200, which is a lie a monitor would believe.
    location / {
        proxy_pass http://127.0.0.1:3000;
        error_page 502 503 504 =503 @starting;
    }

    # API clients get a REAL failure status — never the HTML page. /api/health is
    # the liveness probe: if it answered 200 with a "starting" page, every uptime
    # check would report green while the app was down. That is the exact shape of
    # a check that cannot fail (docs/VERIFICATION.md #2).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
    }


    # ---------------------------------------------------------------------
    # Spec 0146: the Temporal UI, behind the launchpad's own session.
    #
    # temporalio/ui ships with NO authentication and can terminate and reset
    # workflows, which is why it has always been bound to 127.0.0.1 and reached
    # over an SSH tunnel. The owner asked for it in the browser, gated on "auth to the
    # launchpad" — so nginx asks the app, per request, whether this cookie is a
    # valid session, and serves nothing until it says yes.
    #
    # `auth_request` is a real gate, not a redirect: nginx will not proxy a
    # single byte of the UI (or its assets) unless the subrequest returns 2xx.
    # A browser without that session — signed out, or signed in as MEMBER or
    # VIEWER — is sent to the login page instead of a bare 401, and the
    # response never distinguishes the two cases.
    #
    # The container is given TEMPORAL_UI_PUBLIC_PATH=/temporal so its own asset
    # URLs are built under this prefix; `proxy_pass` therefore has NO trailing
    # slash, which preserves the full request URI.
    location /temporal {
        auth_request /_temporal_auth;
        error_page 401 = @temporal_login;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /_temporal_auth {
        internal;
        proxy_pass http://127.0.0.1:3000/api/auth/verify;
        # The subrequest needs the COOKIES, never the body: it is issued for
        # every asset on the page and the body would be copied each time.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @temporal_login {
        return 302 https://$host/login;
    }

    location @starting {
        root /var/www/launchpad;
        add_header Retry-After 5 always;
        try_files /_starting.html =503;
    }
}
